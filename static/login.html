<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>THERMOONE · Acceso</title>
<style>
*{box-sizing:border-box;margin:0}
body{font-family:system-ui,sans-serif;background:#0b1220;color:#e6edf7;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.box{width:100%;max-width:380px;background:#111a2e;border:1px solid #1e2a47;border-radius:18px;padding:32px 26px}
h1{font-size:28px;letter-spacing:3px;text-align:center;background:linear-gradient(90deg,#38bdf8,#34d399);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{text-align:center;color:#94a3b8;font-size:14px;margin:6px 0 26px}
label{display:block;font-size:13px;color:#94a3b8;margin-bottom:6px}
.campo{margin-bottom:16px}
input{width:100%;background:#0b1220;border:1px solid #2a3a60;border-radius:10px;color:#e6edf7;padding:12px;font-size:16px;outline:none;transition:.2s}
input:focus{border-color:#38bdf8}
.pass{position:relative}
.pass input{padding-right:70px}
.ver{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;color:#38bdf8;font-size:13px;cursor:pointer;padding:8px}
.entrar{width:100%;border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:600;cursor:pointer;background:#38bdf8;color:#04121f;transition:.2s;margin-top:6px}
.entrar:hover{transform:translateY(-2px)}
.entrar:disabled{opacity:.6;cursor:wait;transform:none}
#msg{min-height:20px;margin-top:14px;font-size:14px;text-align:center;color:#fca5a5}
</style>
</head>
<body>
<main class="box">
  <h1>THERMOONE</h1>
  <p class="sub">Inicia sesión para continuar</p>
  <form id="f">
    <div class="campo">
      <label for="u">Usuario</label>
      <input id="u" type="text" autocomplete="username" autocapitalize="none" autofocus required>
    </div>
    <div class="campo">
      <label for="p">Contraseña</label>
      <div class="pass">
        <input id="p" type="password" autocomplete="current-password" required>
        <button type="button" class="ver" id="ver">Mostrar</button>
      </div>
    </div>
    <button class="entrar" id="b" type="submit">Entrar</button>
    <div id="msg" role="alert"></div>
  </form>
</main>
<script>
const $ = id => document.getElementById(id);
$('ver').onclick = () => {
  const oculto = $('p').type === 'password';
  $('p').type = oculto ? 'text' : 'password';
  $('ver').textContent = oculto ? 'Ocultar' : 'Mostrar';
};
$('f').onsubmit = async e => {
  e.preventDefault();
  $('b').disabled = true; $('msg').textContent = '';
  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({usuario: $('u').value.trim(), clave: $('p').value})
    });
    const r = await res.json();
    if (r.ok) { location.href = '/'; return; }
    $('msg').textContent = r.error || 'No se pudo iniciar sesión';
    $('p').value = ''; $('p').focus();
  } catch (err) {
    $('msg').textContent = 'No se pudo conectar con el servidor';
  }
  $('b').disabled = false;
};
</script>
</body>
</html>
